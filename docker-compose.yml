# 服务器常驻部署：单容器同时提供 API 与前端静态资源。
# 前置条件：先 `cp .env.example .env`（compose 会读取它），并按需调整 JOBS_ENABLED。
#
# 用法：
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose down

services:
  app:
    build: .
    image: funds-helper:latest
    container_name: funds-helper
    restart: unless-stopped
    ports:
      - '8787:8787'
    env_file:
      - .env
    environment:
      # 容器内必须监听 0.0.0.0，否则端口映射不可达（会覆盖 .env 里的 HOST）
      HOST: 0.0.0.0
      DB_PATH: /app/data/funds.db
      SERVE_STATIC: 'true'
      TZ: Asia/Shanghai
    volumes:
      # SQLite 落库文件与备份留在宿主机，容器重建不丢历史
      - ./data:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
